<script>

*/if(SYNC_URL)localStorage.setItem('syncUrl',SYNC_URL);
const M={
 10:{name:"October",accent:"#ff8a1f",stamp:"🎃",sky:["#120a24","#3b1450"],ground:"#1a1410",path:"#5b4a3a",tile:"#2a1d33",

/*__M2027__*/
const WIP=new URLSearchParams(location.search).has('wip');
const ym=k=>k>12?[2027,k-12]:[2026,k]; const nowK=(TODAY.getFullYear()-2026)*12+TODAY.getMonth()+1;
const SHOW=Object.keys(M).map(Number).filter(k=>WIP||LIVE.includes(k)).sort((a,b)=>a-b);
let cur=SHOW.includes(nowK)?nowK:SHOW[0], data={}, openDay=null;
const key=(k,d)=>{const[y,m]=ym(k);return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};

const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const isToday=(k,d)=>nowK===k&&TODAY.getDate()===d;
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
// ---- storage
async function load(){data=JSON.parse(localStorage.getItem('cal')||'{}');
 if(SYNC_URL){try{const r=await fetch(SYNC_URL,{cache:'no-store'});if(r.ok){const t=await r.text();const j=t?JSON.parse(t):{};data=j&&j.events?j.events:data;localStorage.setItem('cal',JSON.stringify(data));stat('Shared ✓')}}catch(e){stat('Offline – saved here')}}else stat('This device only · tap to share')}
async function mutate(fn){ // re-fetch, apply, write (minimizes overwriting partner's edits)
 if(SYNC_URL){try{const r=await fetch(SYNC_URL,{cache:'no-store'});if(r.ok){const t=await r.text();const j=t?JSON.parse(t):{};if(j.events)data=j.events}}catch(e){}}
 fn(data);localStorage.setItem('cal',JSON.stringify(data));
 if(SYNC_URL){try{const w=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({events:data})});if(!w.ok)throw 0;stat('Shared ✓')}catch(e){stat('Sync failed – saved here')}}
}
function stat(t){document.getElementById('sync').textContent='⟳ '+t}
document.getElementById('sync').onclick=()=>{const u=prompt('Shared storage URL (GET returns JSON, POST replaces it). Both of you enter the same one. Leave blank for this device only.',SYNC_URL||'');if(u===null)return;SYNC_URL=u.trim();localStorage.setItem('syncUrl',SYNC_URL);load().then(render)};
setInterval(()=>{if(SYNC_URL&&!document.hidden)load().then(()=>{render();if(openDay)list()})},20000);
// ---- 2D board: winding path of tiles
function path(n,W,H){const pts=[],rows=Math.ceil(n/7),top=H*.2,bot=H*.93;
 for(let i=0;i<n;i++){const r=Math.floor(i/7),c=i%7,cc=r%2?6-c:c;const x=W*.1+cc*(W*.8/6),y=top+(r+.5)*((bot-top)/rows)+Math.sin(cc*1.3+r)*H*.012;pts.push([x,y])}return pts}
function render(){
 const m=cur,T=M[m];document.documentElement.style.setProperty('--accent',T.accent);
 document.getElementById('tabs').innerHTML=SHOW.map(k=>`<button class="${k==m?'on':''}" onclick="cur=${k};render()">${M[k].name}${k>12?' ’27':''}</button>`).join('');
 let W=innerWidth,H=innerHeight;const n=dim(m),R=rnd(m*99);let pts,ts,mb;
 if(T.map){mb=(T.board||marchBoard)(W,H);W=mb.W;H=mb.H;pts=mb.P;ts=mb.ts}else if(T.layout&&typeof layPts=='function'){const L=layPts(T,n,W,H);pts=L.P;ts=L.ts}else{pts=path(n,W,H);ts=Math.min(W/9,(H*.7)/(Math.ceil(n/7))*.55,92)}
 {const mv=!T.map;if(mv){let lim=1e9;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++)lim=Math.min(lim,Math.max(Math.abs(pts[i][0]-pts[j][0]),Math.abs(pts[i][1]-pts[j][1])/.8));ts=Math.max(Math.min(ts,lim*.95),Math.min(34,W/11))}
  const o=pts.map(p=>p.slice());pts=pts.map(p=>p.slice());for(let it=0;it<400;it++){let any=0;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[j][0]-pts[i][0],dy=pts[j][1]-pts[i][1],px=ts*1.06-Math.abs(dx),py=ts*.86-Math.abs(dy);if(px>0&&py>0){any=1;const pi=T.pin&&T.pin.includes(i),pj=T.pin&&T.pin.includes(j);if(pi&&pj)continue;const wi=pi?0:pj?2:1,wj=pj?0:pi?2:1;if(px/ts<py/(.8*ts)){const f=px/2*(dx<0?-1:1)||px/2;pts[i][0]-=f*wi;pts[j][0]+=f*wj}else{const f=py/2*(dy<0?-1:1)||py/2;pts[i][1]-=f*wi;pts[j][1]+=f*wj}}}if(!any)break}
  pts.forEach((p,i)=>{p[0]=Math.max(ts/2+2,Math.min(W-ts/2-2,p[0]))});if(T.map)window.__lead=o}
 let s=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T.sky[0]}"/><stop offset="1" stop-color="${T.sky[1]}"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs><rect width="${W}" height="${H}" fill="url(#sk)"/>`;
 s+=T.map?mb.s:(T.deco?themeScenery(T,W,H,R):scenery(m,W,H,R));if(T.ldeco)s+=T.ldeco(W,H);if(T.map&&window.__lead)window.__lead.forEach((p,i)=>{if(Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1])>2)s+=`<line x1="${p[0]}" y1="${p[1]}" x2="${pts[i][0]}" y2="${pts[i][1]}" stroke="${T.accent}" stroke-width="1" opacity=".7"/>`});
 s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${T.path}" stroke-width="${T.map?4:ts*.9}" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
 <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-dasharray="6 9"/>`;
 s+=`<text x="${W/2}" y="${H*.12}" text-anchor="middle" font-size="${Math.min(W/14,40)}" font-weight="700" fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.5)" stroke-width="4">${T.name} ${ym(m)[0]}</text>
 <text x="${W/2}" y="${H*.12+22}" text-anchor="middle" font-size="14" fill="${T.accent}" font-style="italic">${T.title}</text>`;
 pts.forEach(([x,y],i)=>{const d=i+1,ev=(data[key(m,d)]||[]).length,today=isToday(m,d);
  s+=`<g class="tile" onclick="openClose(${d})"><title>${T.spots[i]}</title><rect x="${x-ts/2}" y="${y-ts*.4}" width="${ts}" height="${ts*.8}" rx="9" fill="${T.tile}" stroke="${today?'#fff':T.accent}" stroke-width="${today?4:2}"/>
  <text x="${x}" y="${y-ts*.12}" text-anchor="middle" font-size="${ts*.13}" fill="#fff" opacity=".75">${WD[dow(m,d)].slice(0,3).toUpperCase()}</text>
  <text x="${x}" y="${y+ts*.22}" text-anchor="middle" font-size="${ts*.34}" font-weight="700" fill="#fff">${d}</text>
  ${ev?`<text x="${x+ts*.36}" y="${y-ts*.18}" text-anchor="middle" font-size="${ts*.42}" transform="rotate(-14 ${x+ts*.36} ${y-ts*.18})">${T.stamp}</text>`:''}</g>`;
  if(today){const h=ts*1.5;s+=`<g class="fig"><ellipse cx="${x}" cy="${y-ts*.42+h*.0}" rx="${ts*.6}" ry="${ts*.14}" fill="#000" opacity=".45"/>
   <image href="${HIM}" x="${x-h*.55}" y="${y-ts*.42-h*.78}" height="${h}" width="${h*.54}"/><image href="${HER}" x="${x+h*.02}" y="${y-ts*.42-h*.78}" height="${h}" width="${h*.5}"/></g>`}
 });
 const bd=document.getElementById('board');bd.style.overflow='hidden';bd.style.background=T.map?T.ground:'#000';bd.innerHTML=s.replace('<svg viewBox',T.map?'<svg id="msvg" style="touch-action:none" preserveAspectRatio="xMidYMid meet" viewBox':'<svg viewBox')+'</svg>'+(T.map?'<div id="zbtn"><button onclick="zoomBy(1.5)">+</button><button onclick="zoomBy(1/1.5)">−</button><button onclick="zoomFit()">Fit whole map</button></div>':'');
 if(T.map)setupZoom(W,H);
}
function scenery(m,W,H,R){let s='';
 if(m==10){s+=`<circle cx="${W*.82}" cy="${H*.12}" r="${H*.06}" fill="#f5eec0"/><circle cx="${W*.82}" cy="${H*.12}" r="${H*.09}" fill="#f5eec0" opacity=".15" filter="url(#glow)"/>`;
  // Philly skyline silhouette: City Hall tower, Independence Hall, rowhomes
  let x=0,sk=`M0 ${H*.3}`;while(x<W){const w=20+R()*50,h=H*(.05+R()*.12);sk+=` L${x} ${H*.3-h} L${x+w} ${H*.3-h}`;x+=w}
  s+=`<path d="${sk} L${W} ${H*.3} Z" fill="#0b0613"/><rect x="${W*.45}" y="${H*.08}" width="${W*.03}" height="${H*.22}" fill="#0b0613"/><path d="M${W*.45} ${H*.08} L${W*.465} ${H*.03} L${W*.48} ${H*.08}Z" fill="#0b0613"/>
  <rect x="0" y="${H*.3}" width="${W}" height="${H*.7}" fill="${M[10].ground}"/>`;
  for(let i=0;i<26;i++)s+=`<text x="${R()*W}" y="${H*.3+R()*H*.7}" font-size="${14+R()*18}" opacity=".7">${["🪦","🎃","🕸️","🌲","🦇","🕯️","🏚️"][i%7]}</text>`;
  for(let i=0;i<5;i++)s+=`<text font-size="18" y="${H*(.15+R()*.1)}"><animate attributeName="x" from="-30" to="${W+30}" dur="${9+R()*9}s" repeatCount="indefinite"/>🦇</text>`;}
 if(m==11){s+=`<circle cx="${W*.2}" cy="${H*.18}" r="${H*.07}" fill="#ffd98a"/><path d="M0 ${H*.3} Q${W*.3} ${H*.2} ${W*.6} ${H*.28} T${W} ${H*.26} V${H} H0Z" fill="#a8743a"/><rect y="${H*.33}" width="${W}" height="${H}" fill="${M[11].ground}"/>`;
  for(let i=0;i<30;i++)s+=`<text x="${R()*W}" y="${H*.32+R()*H*.68}" font-size="${14+R()*16}" opacity=".85">${["🍂","🌾","🎃","🌳","🍁","🌽","🦃"][i%7]}</text>`;
  for(let i=0;i<12;i++)s+=`<text font-size="16" x="${R()*W}"><animate attributeName="y" from="-20" to="${H}" dur="${8+R()*8}s" begin="-${R()*8}s" repeatCount="indefinite"/>🍁</text>`;}
 if(m==12){s+=`<path d="M0 ${H*.3} L${W*.2} ${H*.17} L${W*.38} ${H*.28} L${W*.6} ${H*.14} L${W*.8} ${H*.27} L${W} ${H*.2} V${H} H0Z" fill="#cfe0f2"/><rect y="${H*.32}" width="${W}" height="${H}" fill="${M[12].ground}"/>`;
  for(let i=0;i<30;i++)s+=`<text x="${R()*W}" y="${H*.32+R()*H*.68}" font-size="${14+R()*18}">${["🌲","⛄","🎄","🏠","🦌","🎁"][i%6]}</text>`;
  for(let i=0;i<40;i++)s+=`<circle r="${1+R()*2}" fill="#fff" cx="${R()*W}"><animate attributeName="cy" from="-5" to="${H}" dur="${6+R()*8}s" begin="-${R()*8}s" repeatCount="indefinite"/></circle>`;}
 if(m==14){for(let i=0;i<9;i++)s+=`<ellipse cx="${R()*W}" cy="${H*(.05+R()*.3)}" rx="${50+R()*70}" ry="${18+R()*14}" fill="#fff" opacity=".55"><animate attributeName="cx" values="${R()*W};${R()*W};" dur="${30+R()*30}s" repeatCount="indefinite"/></ellipse>`;
  s+=`<circle cx="${W*.78}" cy="${H*.13}" r="${H*.05}" fill="#fff5fa"/><path d="M0 ${H*.36} Q${W*.25} ${H*.28} ${W*.5} ${H*.34} T${W} ${H*.32} V${H} H0Z" fill="${M[14].ground}"/>`;
  for(let i=0;i<26;i++)s+=`<text x="${R()*W}" y="${H*.36+R()*H*.64}" font-size="${14+R()*16}" opacity=".85">${["🌹","💗","🌸","🦋","🏰","☁️"][i%6]}</text>`;
  for(let i=0;i<12;i++)s+=`<text font-size="16" x="${R()*W}"><animate attributeName="y" from="${H}" to="-20" dur="${9+R()*8}s" begin="-${R()*8}s" repeatCount="indefinite"/>💖</text>`}
 return s}
// ---- pinch/drag zoom for map months (manipulates the SVG viewBox)
let ZV=null,ZF=null;
function applyZ(){const s=document.getElementById('msvg');if(s&&ZV)s.setAttribute('viewBox',ZV.join(' '))}
function zoomFit(){ZV=ZF.slice();applyZ()}
function zoomBy(f,cx,cy){if(!ZV)return;const[x,y,w,h]=ZV;if(cx==null){cx=x+w/2;cy=y+h/2}const nw=Math.min(ZF[2]*1.2,Math.max(ZF[2]/12,w/f)),r=nw/w;ZV=[cx-(cx-x)*r,cy-(cy-y)*r,nw,h*r];applyZ()}
function svgPt(s,e){const r=s.getBoundingClientRect(),[x,y,w,h]=ZV,sc=Math.min(r.width/w,r.height/h),ox=(r.width-w*sc)/2,oy=(r.height-h*sc)/2;return[x+(e.clientX-r.left-ox)/sc,y+(e.clientY-r.top-oy)/sc,sc]}
let ZK='';function setupZoom(W,H){const k=cur+'|'+W+'|'+H;ZF=[0,0,W,H];if(k!==ZK||!ZV){ZV=ZF.slice();ZK=k}applyZ();const s=document.getElementById('msvg'),pts=new Map();let moved=0,start=null,pd=0;
 s.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);moved=0;start=[e.clientX,e.clientY];if(pts.size==2){const[a,b]=[...pts.values()];pd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
 s.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,e);
  if(pts.size==1){const dx=e.clientX-prev.clientX,dy=e.clientY-prev.clientY;if(Math.hypot(e.clientX-start[0],e.clientY-start[1])>6)moved=1;if(moved){const sc=svgPt(s,e)[2];ZV[0]-=dx/sc;ZV[1]-=dy/sc;applyZ()}}
  else if(pts.size==2){moved=1;const[a,b]=[...pts.values()],nd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd){const m={clientX:(a.clientX+b.clientX)/2,clientY:(a.clientY+b.clientY)/2},p=svgPt(s,m);zoomBy(nd/pd,p[0],p[1])}pd=nd}});
 const up=e=>{pts.delete(e.pointerId);pd=0};s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up);
 s.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=0}},true);
 s.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(s,e);zoomBy(e.deltaY<0?1.2:1/1.2,p[0],p[1])},{passive:false})}
// ---- close-up street view
function openClose(d){openDay=d;const m=cur,T=M[m],R=rnd(m*1000+d),spot=T.spots[d-1];
 document.getElementById('ttl').textContent=`${T.name} ${d} · ${spot}`;
 document.getElementById('sub').textContent=`${WD[dow(m,d)]}, ${T.name} ${d}, ${ym(m)[0]}${isToday(m,d)?' · You are here today':''}`;
 const g=T.sky;let h=`<div style="position:absolute;inset:0;background:linear-gradient(${g[0]},${g[1]})"></div>`;
 // far layer, mid layer, ground + props unique per day (seeded)
 const far=[],mid=[];
 const farSet={10:["🏛️","🏚️","⛪","🏰"],11:["🌳","🏡","🌲","🛖"],12:["🏔️","🌲","🏠","⛪"],14:["🏰","☁️","🌈","🎠"],15:["🏘️","🏛️","🏢","🍺"]}[m]||T.far||T.props;
 for(let i=0;i<8;i++)far.push(`<span class="p" style="left:${i*13+R()*5}%;bottom:${48+R()*6}%;font-size:${60+R()*50}px;opacity:.55;filter:${m==10?'brightness(.35) hue-rotate(250deg)':'none'}">${farSet[Math.floor(R()*4)]}</span>`);
 for(let i=0;i<7;i++)mid.push(`<span class="p" style="left:${R()*100}%;bottom:${22+R()*18}%;font-size:${40+R()*40}px">${T.props[Math.floor(R()*T.props.length)]}</span>`);
 h+=`<div class="layer" data-k="8" style="top:0">${m==10?`<div class="p" style="right:15%;top:10%;width:90px;height:90px;border-radius:50%;background:#f5eec0;box-shadow:0 0 60px #f5eec0"></div>`:m==11?`<div class="p" style="left:12%;top:12%;width:100px;height:100px;border-radius:50%;background:#ffd98a;box-shadow:0 0 80px #ffb347"></div>`:''}${far.join('')}</div>`;
 h+=`<div class="layer" data-k="20" style="top:0">${mid.join('')}</div>`;
 h+=`<div class="layer" data-k="35" style="height:30%;background:linear-gradient(${T.path},${T.ground});border-top:6px solid rgba(255,255,255,.12)"></div>`;
 // animated ambient: flying/falling things + lamp flicker
 const amb={10:"🦇",11:"🍂",12:"❄️",14:"🌸",15:"☘️"}[m]||T.amb||'✨';
 for(let i=0;i<14;i++){const fall=m!=10;h+=`<span class="p amb" style="font-size:${14+R()*18}px;left:${fall?R()*100:-10}%;top:${fall?-10:10+R()*40}%;animation:${fall?'fall':'fly'} ${6+R()*8}s linear ${-R()*10}s infinite">${amb}</span>`}
 h+=`<div class="p" style="left:18%;bottom:22%;font-size:60px;animation:flick 2.5s infinite">${m==10?'🕯️':m==11?'🏮':'🕯️'}</div><div class="p" style="right:16%;bottom:24%;font-size:70px">${T.props[d%T.props.length]}</div>`;
 h+=closeExtra(m,d,R);
 h+=`<div class="figs"><img src="${HIM}" alt="Him"><img src="${HER}" alt="Her"></div>`;
 if(m==10)h+=`<div class="p" style="inset:0;background:radial-gradient(ellipse at 50% 70%,transparent 30%,rgba(10,0,20,.75));animation:fog 6s ease-in-out infinite"></div>`;
 const sc=document.getElementById('scene');sc.innerHTML=h;sc.classList.remove('real');
 {const [yy,mo]=ym(m),ds=`${yy}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,im=new Image();sc.classList.remove('photo');
  im.onload=()=>{if(openDay!==d||cur!==m)return;im.className='bdimg';im.alt='';sc.appendChild(im);const T2=M[m],D2=T2.days&&T2.days[d-1],cap=(T2.photoCap&&T2.photoCap[d-1])||(T2.caps&&T2.caps[d-1])||(D2?D2[1]:'');
   sc.insertAdjacentHTML('beforeend',`<div class="pcap"><div style="font:900 clamp(18px,5vw,26px) Georgia">${T2.spots[d-1]}</div>${cap?`<div style="font:italic 700 clamp(14px,3.8vw,17px) Georgia;margin-top:4px">${typeof capFix=='function'?capFix(cap):cap}</div>`:''}</div>`);sc.classList.add('photo');sc.classList.toggle('real',m==13||m==15);requestAnimationFrame(fixCapOverlap);setTimeout(fixCapOverlap,400)};
  let tried=0;im.onerror=()=>{if(tried++)return;fetch(`assets/backdrops/${ds}.jpg.b64`).then(r=>r.ok?r.text():Promise.reject()).then(t=>{im.src=t.trim()}).catch(()=>{})};im.src=`assets/backdrops/${ds}.jpg`}
 document.getElementById('close').classList.add('open');document.getElementById('f').classList.remove('on');list();
}

window.BDCAPHI=[];window.BDPOS={};window.BDCENTER=['7/15','22/15','23/15','7/13','27/13','19/13','30/13','18/13','4/13','22/13','11/13','26/13','29/13','31/13'];
function capCards(){return [...document.querySelectorAll('#scene .pcap,#scene [style*="translateX(-50%)"]')].filter(e=>e.offsetParent&&e.textContent.trim()&&getComputedStyle(e).display!='none'&&!e.closest('.figs'))}
function fixCapOverlap(){const pn=document.querySelector('#close .panel');if(!pn)return;const pb=pn.getBoundingClientRect();
 const sc=document.getElementById('scene');if(sc.classList.contains('real')&&sc.classList.contains('photo')){const st=sc.getBoundingClientRect(),bi=sc.querySelector('.bdimg'),pc=sc.querySelector('.pcap'),fg=sc.querySelector('.figs'),bk=[...document.querySelectorAll('#close button')].find(b=>/Back/.test(b.textContent));const t=Math.ceil(pb.bottom-st.top+4);if(bi){bi.style.top=t+'px';bi.style.height=`calc(100% - ${t}px)`;bi.style.objectPosition=(window.BDPOS||{})[openDay+'/'+cur]||((window.BDCENTER||[]).includes(openDay+'/'+cur)?'50% 50%':'50% 0');bi.style.objectFit=(cur==15||cur==13)?'contain':'cover'}if(pc){let lim=st.bottom;[fg,bk].forEach(x=>{if(x){const xr=x.getBoundingClientRect();if(xr.height)lim=Math.min(lim,xr.top)}});pc.dataset.ot=pc.dataset.ot??'';pc.style.top=((window.BDCAPHI||[]).includes(openDay+'/'+cur)?t+250:Math.max(t,Math.floor(lim-st.top-pc.offsetHeight-8)))+'px'}return}
 capCards().forEach(e=>{if(e.dataset.ot===undefined)e.dataset.ot=e.style.top||'';e.style.top=e.dataset.ot;const r=e.getBoundingClientRect();
  if(r.top<pb.bottom+6&&r.bottom>pb.top&&r.left<pb.right&&r.right>pb.left){const sh=pb.bottom+8-r.top,pr=e.offsetParent.getBoundingClientRect();e.style.top=Math.ceil(r.top-pr.top+sh)+'px'}})}
addEventListener('resize',()=>{if(openDay)fixCapOverlap()});
function list(){const items=(data[key(cur,openDay)]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
 document.getElementById('list').innerHTML=items.length?items.map(e=>`<li><b>${fmt(e.time)}</b><span>${esc(e.text)}</span><button title="Delete" onclick="del('${e.id}')">✕</button></li>`).join(''):'<li style="opacity:.7">Nothing logged yet.</li>';requestAnimationFrame(fixCapOverlap)}
const fmt=t=>{const[h,m]=t.split(':').map(Number);return`${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`};
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function del(id){const k=key(cur,openDay);await mutate(d=>{d[k]=(d[k]||[]).filter(e=>e.id!==id);if(!d[k].length)delete d[k]});list();render()}
document.getElementById('logbtn').onclick=()=>{document.getElementById('f').classList.toggle('on');document.getElementById('ev').focus()};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const k=key(cur,openDay),it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:ev.value.trim(),time:tm.value};
 if(!it.text||!it.time)return;await mutate(d=>{(d[k]=d[k]||[]).push(it)});ev.value='';tm.value='';e.target.classList.remove('on');list();render()};
document.getElementById('back').onclick=()=>{document.getElementById('close').classList.remove('open');openDay=null};
addEventListener('pointermove',e=>{if(!openDay)return;const dx=e.clientX/innerWidth-.5;document.querySelectorAll('.layer').forEach(l=>l.style.transform=`translateX(${-dx*l.dataset.k}px)`)});
addEventListener('resize',render);
document.head.insertAdjacentHTML('beforeend',`<style>@keyframes fall{to{transform:translate(40px,110vh) rotate(360deg)}}@keyframes fly{to{transform:translate(120vw,-10vh)}}@keyframes flick{50%{opacity:.55}}@keyframes fog{50%{opacity:.75}}</style>`);
load().then(render);render();{const q=new URLSearchParams(location.search);if(q.get("m"))cur=+q.get("m"),render();if(q.get("day"))openClose(+q.get("day"))}
</script></body></html>
