<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosswires</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23ECE4C2%27/%3E%3Cpath d=%27M8 8h16M8 24h16M8 8v16M24 8v16%27 stroke=%27%231B1F2A%27 stroke-width=%273%27 fill=%27none%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* A telegram desk: yellowed wire paper, blue-black ink, one red stamp, teal for the partner. Single column, 480px max. */
:root{--paper:#ECE4C2;--panel:#F5EFD6;--ink:#1B1F2A;--pencil:#5F5D50;--stamp:#A52A1F;--wire:#1F5560;--rule:#C7BD96;
--fd:'Special Elite','Courier Prime','Courier New',monospace;--fb:'Courier Prime','Courier New',monospace;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.4}
body{display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--wire);outline-offset:2px}
.mast{border-top:5px solid var(--ink);border-bottom:2px solid var(--ink);padding:6px 0;display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.title{font-family:var(--fd);font-size:46px;line-height:1;letter-spacing:-.01em;margin:6px 0 0}
.deck{font-size:15px;color:var(--pencil);margin:0}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 14px;min-height:48px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.btn.alt{background:transparent;color:var(--ink)}
.btn.red{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--panel);border:1.5px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:3px 3px 0 var(--rule)}
.card h3{font-size:18px}
.small{font-size:13px;color:var(--pencil);margin:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{border:1.5px solid var(--ink);background:var(--panel);padding:8px 0 6px;text-align:center;font-family:var(--fd);font-size:20px;line-height:1.1}
.tile small{display:block;font-family:var(--fb);font-size:11px;color:var(--stamp);letter-spacing:.05em;min-height:14px}
.tile:disabled{opacity:.35;cursor:default}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-top:3px double var(--ink);padding-top:6px}
.dots{display:flex;gap:6px;align-items:center}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--stamp)}.dot.on{background:var(--stamp)}
.banner{padding:8px 10px;text-align:center;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;border:2px solid var(--ink)}
.banner.mine{background:var(--stamp);border-color:var(--stamp);color:#fff}
.banner.wait{background:transparent;color:var(--pencil);border-style:dashed}
.coach{border-left:4px solid var(--wire);background:var(--panel);padding:8px 10px;font-size:14px}
.msg{min-height:44px;font-size:14px;border-left:4px solid var(--rule);padding:2px 0 2px 10px;margin:0}
.msg:empty{border-color:transparent}
.msg.bad{border-color:var(--stamp)}.msg.good{border-color:var(--wire)}
.board{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:100%;max-width:360px;margin:0 auto}
.cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--panel);border:2px solid var(--ink);font-family:var(--fd);font-size:min(9vw,34px);text-transform:uppercase}
.cell.off{background:repeating-linear-gradient(45deg,var(--rule) 0 3px,transparent 3px 7px);border-color:var(--rule)}
.cell .tag{position:absolute;top:1px;left:3px;font-family:var(--fb);font-size:10px;font-weight:700;color:var(--pencil);letter-spacing:0}
.cell.x::after,.dia::after{content:'';position:absolute;right:4px;bottom:4px;width:7px;height:7px;background:var(--wire);transform:rotate(45deg)}
.dia{position:relative;display:inline-block;width:14px;height:11px;vertical-align:middle}
.cell.sel{box-shadow:inset 0 0 0 3px var(--stamp)}
.cell .l{color:var(--ink)}.cell .l.mine{color:var(--pencil)}.cell .l.theirs{color:var(--wire)}
.cell.locked{background:#fff8dc}
.legend{font-size:12px;color:var(--pencil);text-align:center;margin:0}
.clues{display:flex;flex-direction:column;gap:6px}
.clue{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--ink);background:var(--panel);padding:8px 10px;min-height:48px;width:100%}
.clue .n{font-family:var(--fd);font-size:20px;color:var(--stamp);min-width:30px}
.clue .t{flex:1;font-size:15px}.clue .s{font-size:12px;color:var(--pencil);display:block;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
.clue.sel{background:var(--ink);color:var(--paper)}.clue.sel .n,.clue.sel .s{color:var(--paper)}
.clue.done{opacity:.6;border-style:dashed}
.entry{display:flex;flex-direction:column;gap:8px}
#wordIn{width:100%;font:700 26px/1 var(--fb);letter-spacing:.35em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--ink);background:#fff8dc;color:var(--ink);text-align:center}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wc{border:2px solid var(--ink);background:var(--panel);padding:8px 12px;min-height:44px;font:700 18px var(--fb);letter-spacing:.12em;text-transform:uppercase}
.wc.dim{opacity:.35;border-style:dashed}
.wc[aria-pressed=true]{background:var(--ink);color:var(--paper);opacity:1;border-style:solid}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--wire);color:var(--wire);background:transparent;border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px}
.chip[aria-pressed=true]{background:var(--wire);color:var(--paper)}
.lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil)}
.partnerchip{font-size:13px;color:var(--wire)}
.cover{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.stamp{display:inline-block;align-self:center;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--fd);font-size:34px;letter-spacing:.12em;padding:6px 16px;text-transform:uppercase;transform:rotate(-6deg)}
.stamp.slam{animation:slam .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slam{from{transform:rotate(-6deg) scale(1.8);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.shake{animation:shake .28s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.press{animation:press .15s}@keyframes press{from{transform:scale(1.08)}to{transform:scale(1)}}
.stars{font-size:26px;letter-spacing:.2em;color:var(--stamp)}
.seal{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--wire);border:1.5px solid var(--wire);padding:2px 8px;align-self:center}
.menu{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.menu button{background:none;border:0;text-decoration:underline;font-size:13px;color:var(--pencil);min-height:36px;padding:0}
.rules ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules .num{font-family:var(--fd);font-size:24px;color:var(--stamp);min-width:24px;line-height:1.1}
.rules h3{font-size:17px;margin-bottom:2px}
.rules p{margin:0;font-size:15px}
.miniwrap{display:flex;flex-direction:column;gap:6px;align-items:center}
.miniwrap .board{max-width:150px}
.miniwrap .cell{font-size:24px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"><noscript>Crosswires needs JavaScript.</noscript></main>
<script type="module" src="main.js"></script>
</body>
</html>
