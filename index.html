<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Board · 2026</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Georgia,serif;color:#fff;overflow:hidden;background:#000}
#tabs{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;overflow-x:auto;justify-content:flex-start!important;gap:6px;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 8px 8px}
#tabs button{flex:0 0 auto;border:0;border-radius:20px;padding:7px 14px;font:600 14px Georgia;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(6px);cursor:pointer}
#tabs button.on{background:var(--accent);color:#111}
#zbtn{position:fixed;right:10px;bottom:46px;z-index:20;display:flex;flex-direction:column;gap:6px}#zbtn button{border:0;border-radius:12px;min-width:44px;height:40px;font:700 18px Georgia;background:rgba(0,0,0,.6);color:#fff;padding:0 10px}#zbtn button:last-child{font-size:13px}
#sync{position:fixed;right:10px;bottom:10px;z-index:20;font:12px sans-serif;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:14px;cursor:pointer}
#board{position:fixed;inset:0}#board svg{width:100%;height:100%;display:block}
.tile{cursor:pointer}.tile:hover rect{filter:brightness(1.25)}
.fig{pointer-events:none}
#close{position:fixed;inset:0;z-index:30;display:none;overflow:hidden}
#close.open{display:block;animation:zin .5s ease}
@keyframes zin{from{transform:scale(1.4);opacity:0}to{transform:none;opacity:1}}
#scene{position:absolute;inset:0}
.layer{position:absolute;left:-10%;right:-10%;bottom:0;transition:transform .2s}
.figs{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:2vw;z-index:5}
.figs img{height:min(40vh,52vw);filter:drop-shadow(0 18px 12px rgba(0,0,0,.6));animation:bob 3s ease-in-out infinite}
.figs img+img{animation-delay:-1.5s}
@keyframes bob{50%{transform:translateY(-6px) rotate(1deg)}}
.panel{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));z-index:8;background:rgba(10,10,15,.72);backdrop-filter:blur(8px);border-radius:16px;padding:12px 14px;max-width:460px;margin:auto;max-height:46vh;overflow:auto}
.panel h2{margin:0 0 2px;font-size:22px}.panel .sub{opacity:.8;font-size:14px;margin-bottom:8px}
.btn{border:0;border-radius:12px;padding:9px 14px;font:700 14px Georgia;cursor:pointer;background:var(--accent);color:#111}
.ghost{background:rgba(255,255,255,.15);color:#fff}
form{display:none;gap:6px;flex-wrap:wrap;margin:8px 0}form.on{display:flex}
input{flex:1 1 120px;padding:9px;border-radius:10px;border:0;font:15px Georgia}
ul{list-style:none;padding:0;margin:8px 0 0}li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.15)}
li b{min-width:70px;color:var(--accent)}li span{flex:1}li button{background:none;border:0;color:#f88;cursor:pointer;font-size:16px}
#back{position:absolute;left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:9}
.p{position:absolute;pointer-events:none}
</style></head><body>
<div id="tabs"></div><div id="board"></div>
<div id="close"><div id="scene"></div>
 <div class="panel"><h2 id="ttl"></h2><div class="sub" id="sub"></div>

  <form id="f"><input id="ev" placeholder="Event" required maxlength="120"><input id="tm" type="time" required style="flex:0 1 120px"><button class="btn">Submit</button></form>
  <ul id="list"></ul></div>
 <button class="btn ghost" id="back">← Back to month</button></div>

  s+=`<circle cx="${W*.78}" cy="${H*.13}" r="${H*.05}" fill="#fff5fa"/><path d="M0 ${H*.36} Q${W*.25} ${H*.28} ${W*.5} ${H*.34} T${W} ${H*.32} V${H} H0Z" fill="${M[14].ground}"/>`;
  for(let i=0;i<26;i++)s+=`<text x="${R()*W}" y="${H*.36+R()*H*.64}" font-size="${14+R()*16}" opacity=".85">${["🌹","💗","🌸","🦋","🏰","☁️"][i%6]}</text>`;
  for(let i=0;i<12;i++)s+=`<text font-size="16" x="${R()*W}"><animate attributeName="y" from="${H}" to="-20" dur="${9+R()*8}s" begin="-${R()*8}s" repeatCount="indefinite"/>💖</text>`}
 return s}
// ---- pinch/drag zoom for map months (manipulates the SVG viewBox)
let ZV=null,ZF=null;
function applyZ(){const s=document.getElementById('msvg');if(s&&ZV)s.setAttribute('viewBox',ZV.join(' '))}
function zoomFit(){ZV=ZF.slice();applyZ()}
function zoomBy(f,cx,cy){if(!ZV)return;const[x,y,w,h]=ZV;if(cx==null){cx=x+w/2;cy=y+h/2}const nw=Math.min(ZF[2]*1.2,Math.max(ZF[2]/12,w/f)),r=nw/w;ZV=[cx-(cx-x)*r,cy-(cy-y)*r,nw,h*r];applyZ()}
function svgPt(s,e){const r=s.getBoundingClientRect(),[x,y,w,h]=ZV,sc=Math.min(r.width/w,r.height/h),ox=(r.width-w*sc)/2,oy=(r.height-h*sc)/2;return[x+(e.clientX-r.left-ox)/sc,y+(e.clientY-r.top-oy)/sc,sc]}
let ZK='';function setupZoom(W,H){const k=cur+'|'+W+'|'+H;ZF=[0,0,W,H];if(k!==ZK||!ZV){ZV=ZF.slice();ZK=k}applyZ();const s=document.getElementById('msvg'),pts=new Map();let moved=0,start=null,pd=0;
 s.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e);moved=0;start=[e.clientX,e.clientY];if(pts.size==2){const[a,b]=[...pts.values()];pd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
 s.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,e);
  if(pts.size==1){const dx=e.clientX-prev.clientX,dy=e.clientY-prev.clientY;if(Math.hypot(e.clientX-start[0],e.clientY-start[1])>6)moved=1;if(moved){const sc=svgPt(s,e)[2];ZV[0]-=dx/sc;ZV[1]-=dy/sc;applyZ()}}
  else if(pts.size==2){moved=1;const[a,b]=[...pts.values()],nd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd){const m={clientX:(a.clientX+b.clientX)/2,clientY:(a.clientY+b.clientY)/2},p=svgPt(s,m);zoomBy(nd/pd,p[0],p[1])}pd=nd}});
 const up=e=>{pts.delete(e.pointerId);pd=0};s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up);
 s.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=0}},true);
 s.addEventListener('wheel',e=>{e.preventDefault();const p=svgPt(s,e);zoomBy(e.deltaY<0?1.2:1/1.2,p[0],p[1])},{passive:false})}
// ---- close-up street view
function openClose(d){openDay=d;const m=cur,T=M[m],R=rnd(m*1000+d),spot=T.spots[d-1];
 document.getElementById('ttl').textContent=`${T.name} ${d} · ${spot}`;
 document.getElementById('sub').textContent=`${WD[dow(m,d)]}, ${T.name} ${d}, ${ym(m)[0]}${isToday(m,d)?' · You are here today':''}`;
 const g=T.sky;let h=`<div style="position:absolute;inset:0;background:linear-gradient(${g[0]},${g[1]})"></div>`;
 // far layer, mid layer, ground + props unique per day (seeded)
 const far=[],mid=[];
 const farSet={10:["🏛️","🏚️","⛪","🏰"],11:["🌳","🏡","🌲","🛖"],12:["🏔️","🌲","🏠","⛪"],14:["🏰","☁️","🌈","🎠"],15:["🏘️","🏛️","🏢","🍺"]}[m]||T.far||T.props;
 for(let i=0;i<8;i++)far.push(`<span class="p" style="left:${i*13+R()*5}%;bottom:${48+R()*6}%;font-size:${60+R()*50}px;opacity:.55;filter:${m==10?'brightness(.35) hue-rotate(250deg)':'none'}">${farSet[Math.floor(R()*4)]}</span>`);
 for(let i=0;i<7;i++)mid.push(`<span class="p" style="left:${R()*100}%;bottom:${22+R()*18}%;font-size:${40+R()*40}px">${T.props[Math.floor(R()*T.props.length)]}</span>`);
 h+=`<div class="layer" data-k="8" style="top:0">${m==10?`<div class="p" style="right:15%;top:10%;width:90px;height:90px;border-radius:50%;background:#f5eec0;box-shadow:0 0 60px #f5eec0"></div>`:m==11?`<div class="p" style="left:12%;top:12%;width:100px;height:100px;border-radius:50%;background:#ffd98a;box-shadow:0 0 80px #ffb347"></div>`:''}${far.join('')}</div>`;
 h+=`<div class="layer" data-k="20" style="top:0">${mid.join('')}</div>`;
 h+=`<div class="layer" data-k="35" style="height:30%;background:linear-gradient(${T.path},${T.ground});border-top:6px solid rgba(255,255,255,.12)"></div>`;
 // animated ambient: flying/falling things + lamp flicker
 const amb={10:"🦇",11:"🍂",12:"❄️",14:"🌸",15:"☘️"}[m]||T.amb||'✨';
 for(let i=0;i<14;i++){const fall=m!=10;h+=`<span class="p amb" style="font-size:${14+R()*18}px;left:${fall?R()*100:-10}%;top:${fall?-10:10+R()*40}%;animation:${fall?'fall':'fly'} ${6+R()*8}s linear ${-R()*10}s infinite">${amb}</span>`}
 h+=`<div class="p" style="left:18%;bottom:22%;font-size:60px;animation:flick 2.5s infinite">${m==10?'🕯️':m==11?'🏮':'🕯️'}</div><div class="p" style="right:16%;bottom:24%;font-size:70px">${T.props[d%T.props.length]}</div>`;
 h+=closeExtra(m,d,R);
 h+=`<div class="figs"><img src="${HIM}" alt="Him"><img src="${HER}" alt="Her"></div>`;
 if(m==10)h+=`<div class="p" style="inset:0;background:radial-gradient(ellipse at 50% 70%,transparent 30%,rgba(10,0,20,.75));animation:fog 6s ease-in-out infinite"></div>`;
 const sc=document.getElementById('scene');sc.innerHTML=h;
 document.getElementById('close').classList.add('open');document.getElementById('f').classList.remove('on');list();
}
function list(){const items=(data[key(cur,openDay)]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
 document.getElementById('list').innerHTML=items.length?items.map(e=>`<li><b>${fmt(e.time)}</b><span>${esc(e.text)}</span><button title="Delete" onclick="del('${e.id}')">✕</button></li>`).join(''):'<li style="opacity:.7">Nothing logged yet.</li>'}
const fmt=t=>{const[h,m]=t.split(':').map(Number);return`${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`};
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function del(id){const k=key(cur,openDay);await mutate(d=>{d[k]=(d[k]||[]).filter(e=>e.id!==id);if(!d[k].length)delete d[k]});list();render()}
document.getElementById('logbtn').onclick=()=>{document.getElementById('f').classList.toggle('on');document.getElementById('ev').focus()};
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const k=key(cur,openDay),it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:ev.value.trim(),time:tm.value};
 if(!it.text||!it.time)return;await mutate(d=>{(d[k]=d[k]||[]).push(it)});ev.value='';tm.value='';e.target.classList.remove('on');list();render()};
document.getElementById('back').onclick=()=>{document.getElementById('close').classList.remove('open');openDay=null};
addEventListener('pointermove',e=>{if(!openDay)return;const dx=e.clientX/innerWidth-.5;document.querySelectorAll('.layer').forEach(l=>l.style.transform=`translateX(${-dx*l.dataset.k}px)`)});
addEventListener('resize',render);
document.head.insertAdjacentHTML('beforeend',`<style>@keyframes fall{to{transform:translate(40px,110vh) rotate(360deg)}}@keyframes fly{to{transform:translate(120vw,-10vh)}}@keyframes flick{50%{opacity:.55}}@keyframes fog{50%{opacity:.75}}</style>`);
load().then(render);render();{const q=new URLSearchParams(location.search);if(q.get("m"))cur=+q.get("m"),render();if(q.get("day"))openClose(+q.get("day"))}
