<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Georgia,serif;background:#0b2a4a;color:#fff;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;z-index:20;background:#0b2a4a;padding:max(8px,env(safe-area-inset-top)) 8px 6px;border-bottom:3px solid #f2b705}
h1{margin:0 0 6px;font-size:20px;text-align:center;letter-spacing:.5px}h1 span{color:#f2b705}
nav{display:flex;gap:6px}nav button{flex:1;padding:9px 2px;border:2px solid #f2b705;background:transparent;color:#fff;border-radius:10px;font:600 14px Georgia}
nav button.on{background:#f2b705;color:#0b2a4a}
main{position:absolute;top:calc(92px + env(safe-area-inset-top));left:0;right:0;bottom:0;overflow:auto}
.view{display:none;padding:12px 12px 40px}.view.on{display:block}
.wheelbox{display:flex;flex-direction:column;align-items:center;gap:10px}
.wrap{position:relative;width:min(340px,88vw);height:min(340px,88vw)}
canvas.wh{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 6px #f2b705,0 0 30px #f2b70588}
.ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #e8323c;z-index:2}
.spin{padding:14px 40px;font:700 20px Georgia;border:0;border-radius:30px;background:#e8323c;color:#fff;box-shadow:0 4px 0 #8a1a20}
.spin:disabled{opacity:.5}
.spinrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}#fD,#fQ{background:#f2b705!important;color:#0b2a4a!important;box-shadow:0 4px 0 #8a6a00}
#five{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px 0}
#five .box{background:#fff;color:#0b2a4a;border-radius:14px;padding:14px;width:min(370px,94vw);border:4px solid #f2b705}
#five h2{margin:0 0 4px;font-size:22px}#five .pk{border-top:1px solid #ddd;padding:9px 0}#five .pk b{display:block;font-size:17px;overflow-wrap:anywhere}
#five .pk small{display:block;font-size:13px;opacity:.85}#five .pk .hr{font-size:13px;margin-top:2px}#five .pk a{display:inline-block;margin:6px 6px 0 0;padding:6px 10px;background:#0b2a4a;color:#fff;border-radius:8px;text-decoration:none;font-size:13px}
#five .btns{display:flex;gap:8px;margin-top:10px}#five .btns button{flex:1;padding:10px;border-radius:8px;border:0;font:16px Georgia;background:#0b2a4a;color:#fff}#five .btns button.go{background:#e8323c}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{padding:7px 12px;border-radius:16px;border:2px solid #fff6;background:transparent;color:#fff;font:14px Georgia}.chip.on{background:#fff;color:#0b2a4a;border-color:#fff}
.note{font-size:13px;opacity:.85;text-align:center;max-width:340px}
.card{background:#fff;color:#0b2a4a;border-radius:14px;padding:14px;width:min(340px,92vw);border:4px solid #f2b705;display:none}
.card h2{margin:0 0 4px;font-size:22px}.card a{display:inline-block;margin:8px 8px 0 0;padding:8px 12px;background:#0b2a4a;color:#fff;border-radius:8px;text-decoration:none;font-size:14px}
.warn{color:#b0451a;font-size:13px}
#mapwrap{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#e9e3d3}
#map{position:absolute;left:0;top:0;transform-origin:0 0}
.tile{position:absolute;width:118px;height:84px;border-radius:10px;background:#fff;color:#0b2a4a;border:3px solid #0b2a4a;padding:4px 6px;font-size:12px;line-height:1.15;overflow:hidden;box-shadow:0 2px 4px #0005}
.tile .sc{position:absolute;right:5px;bottom:5px;width:34px;height:34px;border:2px solid #0b2a4a;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 15px Georgia;background:#fff}
.tile.v .sc{background:#f2b705}.tile .nm{font-weight:700;padding-right:2px;max-height:42px;overflow:hidden}.tile .ct{position:absolute;left:6px;bottom:5px;font-size:16px}
.tile.x{opacity:.55;background:#ddd}.cl{color:#ff7b7b;font-weight:700}
.tile.D{border-color:#e8323c}.tile.C{border-color:#f28c05}.tile.L{border-color:#2a8f4a}.tile.T{border-color:#6a3fb5}
.hood{position:absolute;width:118px;height:84px;display:flex;align-items:center;justify-content:center;text-align:center;font:700 15px Georgia;color:#fff;background:#0b2a4a;border-radius:42px/30px;padding:4px 8px;pointer-events:none;border:3px solid #f2b705}
#zoom{position:absolute;right:10px;bottom:16px;z-index:5;display:flex;flex-direction:column;gap:6px}#zoom button{width:44px;height:44px;border-radius:50%;border:2px solid #0b2a4a;background:#fff;font:700 22px Georgia;color:#0b2a4a}
.row{display:flex;align-items:center;gap:8px;background:#ffffff14;border-radius:10px;padding:10px;margin-bottom:6px}
.row .n{flex:1;min-width:0}.row .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .n small{opacity:.75}
.row .s{width:46px;height:40px;border-radius:8px;border:2px solid #f2b705;display:flex;align-items:center;justify-content:center;font-weight:700}
.row .s.v{background:#f2b705;color:#0b2a4a}.row button{padding:8px 10px;border-radius:8px;border:0;background:#fff;color:#0b2a4a;font:14px Georgia}
#q{width:100%;padding:10px;border-radius:10px;border:0;font:16px Georgia;margin-bottom:8px}
#ed{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:center;justify-content:center}
#ed .box{background:#fff;color:#0b2a4a;border-radius:14px;padding:16px;width:min(340px,92vw)}#ed input[type=number]{width:100%;font:20px Georgia;padding:8px;margin:8px 0}
#ed .btns{display:flex;gap:8px}#ed .btns button{flex:1;padding:10px;border-radius:8px;border:0;font:16px Georgia;background:#0b2a4a;color:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#f2b705;color:#0b2a4a;padding:8px 14px;border-radius:16px;z-index:60;display:none;font-size:14px}
</style></head><body>

async function pull(){if(!SYNC)return;try{const r=await fetch(SYNC,{cache:'no-store'});if(r.ok){const j=await r.json();const before=JSON.stringify(state.places);merge(j);for(const q of queue)state.places[q.n]=q.r;persist();if(JSON.stringify(state.places)!==before)renderAll()}}catch(e){}}
async function flush(){if(!SYNC||!queue.length)return;try{const r=await fetch(SYNC,{cache:'no-store'});const j=r.ok?await r.json():{places:{}};const out={places:Object.assign({},(j&&j.places)||{})};
for(const q of queue){const cur=out.places[q.n];if(!cur||(cur.t||0)<=q.r.t)out.places[q.n]=q.r}
const p=await fetch(SYNC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(out)});if(!p.ok)throw 0;queue=[];merge(out);persist();toast('Saved & synced ✓')}catch(e){toast('Offline — will sync later')}}
function setRec(n,v,s){const r={v:!!v,s:s,t:Date.now()};state.places[n]=r;queue=queue.filter(q=>q.n!==n);queue.push({n,r});persist();renderAll();flush()}

/* Philly time + hours */
function phl(){const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const g=t=>f.find(x=>x.type===t).value;return{d:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday')),m:+g('hour')*60+ +g('minute')}}

const h=p.h;if(ok(h,d,0)||ok(h,pd,1440))return'open';return'closed'}
function mapsUrl(p){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.n+' '+(p.city||'Philadelphia, PA'))}

function drawWheel(w){w.list=pool(w);const c=document.getElementById(w.cv),x=c.getContext('2d'),R=340,n=w.list.length;x.clearRect(0,0,680,680);

document.getElementById(w.note).textContent=n?`${n} unvisited places on the wheel`+(w.open&&unk?` · ${unk} have unverified hours (kept in, flagged ⚠)`:''):'Nothing left to spin — every place here is visited!';
if(!w.spinning){document.getElementById(w.btn).disabled=!n;document.getElementById(w.five).disabled=!n}if(!n)return;
x.save();x.translate(R,R);x.rotate(w.rot);const a=2*Math.PI/n;
for(let i=0;i<n;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,R,i*a,(i+1)*a);x.fillStyle=COLS[i%(n%COLS.length===1?COLS.length-1:COLS.length)];x.fill();

const fs=Math.max(9,Math.min(22,Math.floor(a*R*0.55)));x.font=`bold ${fs}px Georgia`;x.textAlign='right';x.textBaseline='middle';let t=w.list[i].n;while(x.measureText(t).width>R-60&&t.length>4)t=t.slice(0,-2);if(t!==w.list[i].n)t=t.trim()+'…';x.fillText(t,R-16,0);x.restore()}}

function animTo(w,pick,T,cb){const n=w.list.length,a=2*Math.PI/n,target=-Math.PI/2-(pick*a+a*(0.2+Math.random()*0.6)),start=w.rot;
const fin=start+(((target-start)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)+2*Math.PI*(T>3000?7:2),t0=performance.now();w.spinning=true;
(function f(t){const k=Math.min(1,(t-t0)/T),e=1-Math.pow(1-k,4);w.rot=start+(fin-start)*e;drawWheel(w);if(k<1)requestAnimationFrame(f);else{w.spinning=false;cb()}})(t0)}
function busy(w,b){for(const id of[w.btn,w.five])document.getElementById(id).disabled=b||!w.list.length}
function spin(w){const n=w.list.length;if(!n||w.spinning)return;busy(w,true);document.getElementById(w.card).style.display='none';

function fmtT(m){m=m%1440;const h=Math.floor(m/60),mm=m%60;return(h%12||12)+(mm?':'+String(mm).padStart(2,'0'):'')+(h<12?' AM':' PM')}
function todayHrs(p){if(!p.h)return'⚠ Hours not verified — check before you go';const s=p.h[phl().d]||[];if(!s.length)return'Closed today';

let fiveW=null;
function spin5(w){if(!w.list.length||w.spinning)return;fiveW=w;document.getElementById('five').style.display='none';busy(w,true);document.getElementById(w.card).style.display='none';
